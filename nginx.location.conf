# Include inside the relevant `server { ... }` block in nginx.conf.
# PHP-FPM must be listening on 127.0.0.1:9000.
location = "/Jumper Robotica/Scrapbound/index.php" {
    include fastcgi_params;
    fastcgi_pass 127.0.0.1:9000;
    fastcgi_param SCRIPT_FILENAME "C:/Wemp/nginx/html/Jumper Robotica/Scrapbound/public/index.php";
    fastcgi_param SCRIPT_NAME "/Jumper Robotica/Scrapbound/index.php";
}

location ^~ "/Jumper Robotica/Scrapbound/" {
    alias "C:/Wemp/nginx/html/Jumper Robotica/Scrapbound/public/";
    index index.php;
    try_files $uri $uri/ @scrapbound_laravel;
}

location @scrapbound_laravel {
    include fastcgi_params;
    fastcgi_pass 127.0.0.1:9000;
    fastcgi_param SCRIPT_FILENAME "C:/Wemp/nginx/html/Jumper Robotica/Scrapbound/public/index.php";
    fastcgi_param SCRIPT_NAME "/Jumper Robotica/Scrapbound/index.php";
}
